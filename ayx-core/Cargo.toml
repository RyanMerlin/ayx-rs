[package]
name = "ayx-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
thiserror.workspace = true
tempfile.workspace = true
keyring-core.workspace = true

# keyring 4.x split the platform credential stores into separate crates that
# are registered with keyring-core at runtime. Pick one store per OS:
#  - Linux/FreeBSD: zbus Secret Service (pure-Rust, no system libdbus needed)
#  - macOS: native Keychain
#  - Windows: native Credential Manager
[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1"
