[package]
name = "ayx-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
# Gates the AYX_FORCE_INLINE_SECRETS env-var seam so it is compiled OUT of
# release binaries.  Enable only in [dev-dependencies] of crates that need
# deterministic inline-fallback tests on headless CI (no live keyring).
# Not enabled by default; absent from all production dependency edges.
test-inline-forcing = []

[dependencies]
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
thiserror.workspace = true
tempfile.workspace = true
keyring-core.workspace = true
# OS-entropy source for the audit lifecycle helper's operation-id suffix
# (create_sensitive_audit_artifact). Already a vetted, direct dependency of
# ayx-one-api (PKCE/OAuth state generation) -- reused here rather than
# pulling in a new crate (e.g. `uuid`) for the same primitive need.
getrandom = "0.4"
sha2.workspace = true

# keyring 4.x split the platform credential stores into separate crates that
# are registered with keyring-core at runtime. Pick one store per OS:
#  - Linux/FreeBSD: zbus Secret Service (pure-Rust, no system libdbus needed)
#  - macOS: native Keychain
#  - Windows: native Credential Manager
[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }
