version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Breaking major upgrades deferred until a deliberate migration is scheduled.
    # keyring 4.x and axum 0.8.x both require code changes; staying on the latest
    # 3.x / 0.7.x (cargo-audit clean) avoids surprise red builds.
    ignore:
      - dependency-name: "keyring"
        versions: [">=4.0.0"]
      - dependency-name: "axum"
        versions: [">=0.8.0"]
    groups:
      patch-updates:
        update-types: [patch]
      minor-updates:
        update-types: [minor]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
