name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/**'
  pull_request:
    paths:
      - 'site/**'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

# Never run two production deploys at once; cancel superseded runs per ref.
concurrency:
  group: docs-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & deploy docs
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to commit SHA (supply-chain hardening): this job holds a
      # Cloudflare Pages token, so a moving tag must not be able to swap the code.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: site

      # Builds on every PR too (syncs the generated reference docs, then astro
      # build) so doc breakage is caught before merge, not as a failed deploy.
      - name: Build site
        run: npm run build
        working-directory: site

      # Deploy only on push to main / manual dispatch. PRs build but never see
      # the Cloudflare secret (fork-safe on a public repo).
      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=ayx-rs
          workingDirectory: site
