name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Add Rust target
        shell: bash
        run: rustup target add x86_64-unknown-linux-gnu
      - name: Install cargo-nextest
        run: cargo install --locked cargo-nextest
        shell: bash
      - name: Check formatting
        run: cargo fmt --check
        shell: bash
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
        shell: bash
      - name: Run tests
        run: cargo nextest run --workspace --locked
        shell: bash
      - name: Build release
        run: cargo build --release --locked --target x86_64-unknown-linux-gnu
        shell: bash
      - name: Verify release binary
        shell: bash
        run: |
          set -euo pipefail
          binary="${GITHUB_WORKSPACE}/target/x86_64-unknown-linux-gnu/release/ayx"
          test -x "$binary"
          ls -l "$binary"
          file "$binary"
      - name: Package Linux release
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="${GITHUB_WORKSPACE}/dist"
          package_root="${artifact_dir}/ayx-x86_64-unknown-linux-gnu"
          mkdir -p "$package_root"
          cp "${GITHUB_WORKSPACE}/target/x86_64-unknown-linux-gnu/release/ayx" "$package_root/ayx"
          cp README.md "$package_root/"
          cp scripts/install.sh "$package_root/"
          # List members explicitly (not `.`) so paths are `ayx`, not `./ayx`:
          # self_update matches the archive entry against bin_path_in_archive
          # ("ayx") with an exact Path compare, and `./ayx` != `ayx`.
          tar -czf "${artifact_dir}/ayx-x86_64-unknown-linux-gnu.tar.gz" -C "$package_root" ayx README.md install.sh
      - uses: actions/upload-artifact@v7
        with:
          name: ayx-x86_64-unknown-linux-gnu
          path: dist/ayx-x86_64-unknown-linux-gnu.tar.gz

  build-macos:
    runs-on: macos-latest
    env:
      MACOS_CODESIGN_CERT_P12_B64: ${{ secrets.AYX_MACOS_CODESIGN_CERT_P12_B64 }}
      MACOS_CODESIGN_CERT_PASSWORD: ${{ secrets.AYX_MACOS_CODESIGN_CERT_PASSWORD }}
      MACOS_CODESIGN_IDENTITY: ${{ secrets.AYX_MACOS_CODESIGN_IDENTITY }}
      MACOS_NOTARY_KEY_ID: ${{ secrets.AYX_MACOS_NOTARY_KEY_ID }}
      MACOS_NOTARY_ISSUER_ID: ${{ secrets.AYX_MACOS_NOTARY_ISSUER_ID }}
      MACOS_NOTARY_PRIVATE_KEY_B64: ${{ secrets.AYX_MACOS_NOTARY_PRIVATE_KEY_B64 }}
    strategy:
      matrix:
        target:
          - x86_64-apple-darwin
          - aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v7
      - name: Add Rust target
        shell: bash
        run: rustup target add ${{ matrix.target }}
      - name: Install cargo-nextest
        run: cargo install --locked cargo-nextest
        shell: bash
      - name: Check formatting
        run: cargo fmt --check
        shell: bash
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
        shell: bash
      - name: Run tests
        run: cargo nextest run --workspace --locked
        shell: bash
      - name: Build release
        run: cargo build --release --locked --target ${{ matrix.target }}
        shell: bash
      # Runs unconditionally, unlike the sign/notarize steps below. Without it a
      # release with no signing secrets skips all three of them and still reports
      # green, which is exactly how v0.14.0 shipped unsigned macOS binaries under
      # a passing check. Warn-only by default because signing is deliberately
      # deferred; set the repo variable AYX_REQUIRE_MACOS_SIGNING=true to make it
      # a hard gate the day the certificates land, with no workflow edit.
      - name: Report macOS signing posture
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          REQUIRE_SIGNING: ${{ vars.AYX_REQUIRE_MACOS_SIGNING }}
        run: |
          set -euo pipefail
          if [ -n "$MACOS_CODESIGN_CERT_P12_B64" ] && [ -n "$MACOS_CODESIGN_CERT_PASSWORD" ] && [ -n "$MACOS_CODESIGN_IDENTITY" ] && [ -n "$MACOS_NOTARY_KEY_ID" ] && [ -n "$MACOS_NOTARY_ISSUER_ID" ] && [ -n "$MACOS_NOTARY_PRIVATE_KEY_B64" ]; then
            echo "macOS signing and notarization are ACTIVE for this build (target: ${TARGET})." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### :warning: macOS binaries are UNSIGNED and NOT NOTARIZED"
            echo
            echo "Target \`${TARGET}\` is missing one or more \`AYX_MACOS_*\` signing/notary secrets."
            echo "Users who download this release will hit Gatekeeper (\"cannot be opened because the developer cannot be verified\" / \"is damaged\") and must manually clear quarantine."
            echo "Signing is deliberately deferred, not accidental, unless \`AYX_REQUIRE_MACOS_SIGNING\` says otherwise below."
          } >> "$GITHUB_STEP_SUMMARY"
          # Workflow commands are parsed from stdout, so these must not be redirected.
          echo "::warning title=Unsigned macOS release::Target ${TARGET} is missing AYX_MACOS_* signing/notary secrets. This release's macOS binaries are unsigned and not notarized; users will hit Gatekeeper."
          if [ "${REQUIRE_SIGNING:-}" = "true" ]; then
            echo "::error title=macOS signing required::AYX_REQUIRE_MACOS_SIGNING=true but signing/notary secrets are missing for target ${TARGET}. Failing the build."
            echo "**AYX_REQUIRE_MACOS_SIGNING=true, so this is a hard failure.**" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      # Gated on the whole codesign triple, not just the certificate. With only
      # the cert present, the import action or `codesign --sign ""` hard-fails
      # the release -- turning a partially-configured secret set into a broken
      # build rather than the unsigned-but-successful one the posture step above
      # just reported.
      - name: Import macOS signing certificate
        if: env.MACOS_CODESIGN_CERT_P12_B64 != '' && env.MACOS_CODESIGN_CERT_PASSWORD != '' && env.MACOS_CODESIGN_IDENTITY != ''
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.AYX_MACOS_CODESIGN_CERT_P12_B64 }}
          p12-password: ${{ secrets.AYX_MACOS_CODESIGN_CERT_PASSWORD }}
      - name: Sign macOS release binary
        if: env.MACOS_CODESIGN_CERT_P12_B64 != '' && env.MACOS_CODESIGN_CERT_PASSWORD != '' && env.MACOS_CODESIGN_IDENTITY != ''
        shell: bash
        run: |
          set -euo pipefail
          binary="${GITHUB_WORKSPACE}/target/${{ matrix.target }}/release/ayx"
          codesign --force --options runtime --timestamp --sign "$MACOS_CODESIGN_IDENTITY" "$binary"
      - name: Notarize macOS release archive
        if: env.MACOS_NOTARY_KEY_ID != '' && env.MACOS_NOTARY_ISSUER_ID != '' && env.MACOS_NOTARY_PRIVATE_KEY_B64 != ''
        shell: bash
        run: |
          set -euo pipefail
          key_path="${RUNNER_TEMP}/ayx-notary-key.p8"
          zip_path="${RUNNER_TEMP}/ayx-${{ matrix.target }}-notary.zip"
          printf '%s' "$MACOS_NOTARY_PRIVATE_KEY_B64" | base64 --decode > "$key_path"
          (cd "${GITHUB_WORKSPACE}/target/${{ matrix.target }}/release" && zip -r "$zip_path" ayx)
          xcrun notarytool submit "$zip_path" \
            --key "$key_path" \
            --key-id "$MACOS_NOTARY_KEY_ID" \
            --issuer "$MACOS_NOTARY_ISSUER_ID" \
            --wait
      - name: Verify release binary
        shell: bash
        run: |
          set -euo pipefail
          binary="${GITHUB_WORKSPACE}/target/${{ matrix.target }}/release/ayx"
          test -x "$binary"
          ls -l "$binary"
          file "$binary"
      - name: Package macOS release
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="${GITHUB_WORKSPACE}/dist"
          package_root="${artifact_dir}/ayx-${{ matrix.target }}"
          mkdir -p "$package_root"
          cp "${GITHUB_WORKSPACE}/target/${{ matrix.target }}/release/ayx" "$package_root/ayx"
          cp README.md "$package_root/"
          cp scripts/install.sh "$package_root/"
          # See linux packaging: explicit members so the entry is `ayx`, not `./ayx`.
          tar -czf "${artifact_dir}/ayx-${{ matrix.target }}.tar.gz" -C "$package_root" ayx README.md install.sh
      - uses: actions/upload-artifact@v7
        with:
          name: ayx-${{ matrix.target }}
          path: dist/ayx-${{ matrix.target }}.tar.gz

  build-windows:
    runs-on: windows-latest
    env:
      # Mirror ci.yml's Windows test isolation (#61): force inline secrets so the
      # secret round-trip tests don't contaminate via the shared Windows
      # Credential Manager (keyring) and flake under parallel execution.
      AYX_FORCE_INLINE_SECRETS: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Add Rust target
        shell: bash
        run: rustup target add x86_64-pc-windows-msvc
      - name: Install cargo-nextest
        run: cargo install --locked cargo-nextest
        shell: bash
      - name: Check formatting
        run: cargo fmt --check
        shell: bash
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
        shell: bash
      - name: Run tests
        run: cargo nextest run --workspace --locked
        shell: bash
      - name: Build release
        run: cargo build --release --locked --target x86_64-pc-windows-msvc
        shell: bash
      - name: Verify release binary
        shell: bash
        run: |
          set -euo pipefail
          binary="${GITHUB_WORKSPACE}/target/x86_64-pc-windows-msvc/release/ayx.exe"
          test -f "$binary"
          ls -l "$binary"
      - name: Package Windows release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $artifactDir = Join-Path $env:GITHUB_WORKSPACE 'dist'
          $packageRoot = Join-Path $artifactDir 'ayx-x86_64-pc-windows-msvc'
          New-Item -ItemType Directory -Force -Path $packageRoot | Out-Null
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'target/x86_64-pc-windows-msvc/release/ayx.exe') (Join-Path $packageRoot 'ayx.exe')
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'README.md') $packageRoot
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'scripts/install.ps1') $packageRoot
          $zipPath = Join-Path $artifactDir 'ayx-x86_64-pc-windows-msvc.zip'
          Compress-Archive -Path (Join-Path $packageRoot '*') -DestinationPath $zipPath -Force
      - uses: actions/upload-artifact@v7
        with:
          name: ayx-x86_64-pc-windows-msvc
          path: dist/ayx-x86_64-pc-windows-msvc.zip

  sbom:
    needs:
      - build-linux
      - build-macos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install cargo-cyclonedx
        run: cargo install --locked cargo-cyclonedx --version 0.5.7
      - name: Generate SBOM (CycloneDX)
        run: |
          set -euo pipefail
          mkdir -p sbom
          cargo metadata --format-version 1 --no-deps > metadata.json
          jq -r '.packages[] | [.name, .manifest_path] | @tsv' metadata.json | while IFS=$'\t' read -r package manifest; do
            # cargo-cyclonedx appends .json to --override-filename. Keep the
            # extension out of the override so the emitted file is exactly
            # ${package}.cdx.json, matching the release asset contract below.
            filename="${package}.cdx"
            cargo cyclonedx --manifest-path "$manifest" --format json --override-filename "$filename"
            source="$(dirname "$manifest")/${filename}.json"
            test -f "$source"
            cp "$source" "sbom/${filename}.json"
          done
          expected="$(jq -r '.packages[].name' metadata.json | sort -u)"
          actual="$(find sbom -maxdepth 1 -type f -name '*.cdx.json' -printf '%f\n' | sed 's/\.cdx\.json$//' | sort -u)"
          test "$expected" = "$actual"
          test "$(printf '%s\n' "$actual" | sed '/^$/d' | wc -l)" -gt 0
          ls -la sbom/
      - uses: actions/upload-artifact@v7
        with:
          name: ayx-sbom
          path: sbom/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-linux
      - build-macos
      - build-windows
      - sbom
    runs-on: ubuntu-latest
    # OIDC token for sigstore keyless signing + GH artifact attestations.
    # Both rely on workflow identity (no long-lived secrets / keys).
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
      - name: Flatten release artifacts and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          # Copy archive artifacts to a flat directory.
          for f in \
            dist/ayx-x86_64-unknown-linux-gnu/ayx-x86_64-unknown-linux-gnu.tar.gz \
            dist/ayx-x86_64-apple-darwin/ayx-x86_64-apple-darwin.tar.gz \
            dist/ayx-aarch64-apple-darwin/ayx-aarch64-apple-darwin.tar.gz \
            dist/ayx-x86_64-pc-windows-msvc/ayx-x86_64-pc-windows-msvc.zip; do
            cp "$f" release/
          done
          # Every package SBOM is a first-class signed release asset.
          test -d dist/ayx-sbom
          find dist/ayx-sbom -maxdepth 1 -type f -name '*.cdx.json' -exec cp {} release/ \;
          test -n "$(find release -maxdepth 1 -type f -name '*.cdx.json' -print -quit)"
          # Generate SHA256SUMS over every release file.
          cd release
          sha256sum -- * > SHA256SUMS
          echo "---- SHA256SUMS ----"
          cat SHA256SUMS
      # Sigstore keyless signing. Anchors every artifact to the Rekor
      # transparency log using the workflow's OIDC identity — no keys to
      # rotate, no certs to manage. Verifiers run:
      #   cosign verify-blob \
      #     --certificate-identity-regexp '^https://github.com/.+/ayx-rs/' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      #     --bundle release/<file>.sigstore release/<file>
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign every release artifact (sigstore keyless)
        shell: bash
        run: |
          set -euo pipefail
          cd release
          for f in ayx-*.zip ayx-*.tar.gz *.cdx.json SHA256SUMS; do
            [ -f "$f" ] || continue
            echo "signing $f"
            cosign sign-blob --yes \
              --bundle "$f.sigstore" \
              "$f"
          done
          ls -la -- *.sigstore
      # GitHub-native build provenance (SLSA L3). Independent of cosign.
      # Verifiable with: gh attestation verify <file> --repo <owner>/ayx-rs
      # Non-fatal: this feature requires a public repo (or paid plan) and is
      # otherwise a clean failure; the rest of the release pipeline produces
      # the same verifiable provenance via the sigstore .sigstore bundles.
      - name: Attest build provenance for every release artifact
        continue-on-error: true
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            release/ayx-x86_64-unknown-linux-gnu.tar.gz
            release/ayx-x86_64-apple-darwin.tar.gz
            release/ayx-aarch64-apple-darwin.tar.gz
            release/ayx-x86_64-pc-windows-msvc.zip
            release/*.cdx.json
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release/ayx-x86_64-unknown-linux-gnu.tar.gz
            release/ayx-x86_64-unknown-linux-gnu.tar.gz.sigstore
            release/ayx-x86_64-apple-darwin.tar.gz
            release/ayx-x86_64-apple-darwin.tar.gz.sigstore
            release/ayx-aarch64-apple-darwin.tar.gz
            release/ayx-aarch64-apple-darwin.tar.gz.sigstore
            release/ayx-x86_64-pc-windows-msvc.zip
            release/ayx-x86_64-pc-windows-msvc.zip.sigstore
            release/*.cdx.json
            release/*.cdx.json.sigstore
            release/SHA256SUMS
            release/SHA256SUMS.sigstore
