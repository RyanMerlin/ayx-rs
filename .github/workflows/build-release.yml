name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-unknown-linux-gnu
          rustup component add rustfmt clippy
      - name: Install cargo-nextest
        run: cargo install --locked cargo-nextest
        shell: bash
      - name: Check formatting
        run: cargo fmt --check
        shell: bash
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
        shell: bash
      - name: Run tests
        run: cargo nextest run --workspace
        shell: bash
      - name: Build release
        run: cargo build --release --target x86_64-unknown-linux-gnu
        shell: bash
      - name: Verify release binary
        shell: bash
        run: |
          set -euo pipefail
          binary="${GITHUB_WORKSPACE}/target/x86_64-unknown-linux-gnu/release/ayx"
          test -x "$binary"
          ls -l "$binary"
          file "$binary"
      - name: Package Linux release
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="${GITHUB_WORKSPACE}/dist"
          package_root="${artifact_dir}/ayx-x86_64-unknown-linux-gnu"
          mkdir -p "$package_root"
          cp "${GITHUB_WORKSPACE}/target/x86_64-unknown-linux-gnu/release/ayx" "$package_root/ayx"
          cp README.md "$package_root/"
          cp scripts/install.sh "$package_root/"
          tar -czf "${artifact_dir}/ayx-x86_64-unknown-linux-gnu.tar.gz" -C "$package_root" .
      - uses: actions/upload-artifact@v4
        with:
          name: ayx-x86_64-unknown-linux-gnu
          path: dist/ayx-x86_64-unknown-linux-gnu.tar.gz

  build-macos:
    runs-on: macos-latest
    env:
      MACOS_CODESIGN_CERT_P12_B64: ${{ secrets.AYX_MACOS_CODESIGN_CERT_P12_B64 }}
      MACOS_CODESIGN_CERT_PASSWORD: ${{ secrets.AYX_MACOS_CODESIGN_CERT_PASSWORD }}
      MACOS_CODESIGN_IDENTITY: ${{ secrets.AYX_MACOS_CODESIGN_IDENTITY }}
      MACOS_NOTARY_KEY_ID: ${{ secrets.AYX_MACOS_NOTARY_KEY_ID }}
      MACOS_NOTARY_ISSUER_ID: ${{ secrets.AYX_MACOS_NOTARY_ISSUER_ID }}
      MACOS_NOTARY_PRIVATE_KEY_B64: ${{ secrets.AYX_MACOS_NOTARY_PRIVATE_KEY_B64 }}
    strategy:
      matrix:
        target:
          - x86_64-apple-darwin
          - aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}
          rustup component add rustfmt clippy
      - name: Install cargo-nextest
        run: cargo install --locked cargo-nextest
        shell: bash
      - name: Check formatting
        run: cargo fmt --check
        shell: bash
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
        shell: bash
      - name: Run tests
        run: cargo nextest run --workspace
        shell: bash
      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}
        shell: bash
      - name: Import macOS signing certificate
        if: env.MACOS_CODESIGN_CERT_P12_B64 != ''
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.AYX_MACOS_CODESIGN_CERT_P12_B64 }}
          p12-password: ${{ secrets.AYX_MACOS_CODESIGN_CERT_PASSWORD }}
      - name: Sign macOS release binary
        if: env.MACOS_CODESIGN_CERT_P12_B64 != ''
        shell: bash
        run: |
          set -euo pipefail
          binary="${GITHUB_WORKSPACE}/target/${{ matrix.target }}/release/ayx"
          codesign --force --options runtime --timestamp --sign "$MACOS_CODESIGN_IDENTITY" "$binary"
      - name: Notarize macOS release archive
        if: env.MACOS_NOTARY_KEY_ID != '' && env.MACOS_NOTARY_ISSUER_ID != '' && env.MACOS_NOTARY_PRIVATE_KEY_B64 != ''
        shell: bash
        run: |
          set -euo pipefail
          key_path="${RUNNER_TEMP}/ayx-notary-key.p8"
          zip_path="${RUNNER_TEMP}/ayx-${{ matrix.target }}-notary.zip"
          printf '%s' "$MACOS_NOTARY_PRIVATE_KEY_B64" | base64 --decode > "$key_path"
          (cd "${GITHUB_WORKSPACE}/target/${{ matrix.target }}/release" && zip -r "$zip_path" ayx)
          xcrun notarytool submit "$zip_path" \
            --key "$key_path" \
            --key-id "$MACOS_NOTARY_KEY_ID" \
            --issuer "$MACOS_NOTARY_ISSUER_ID" \
            --wait
      - name: Verify release binary
        shell: bash
        run: |
          set -euo pipefail
          binary="${GITHUB_WORKSPACE}/target/${{ matrix.target }}/release/ayx"
          test -x "$binary"
          ls -l "$binary"
          file "$binary"
      - name: Package macOS release
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="${GITHUB_WORKSPACE}/dist"
          package_root="${artifact_dir}/ayx-${{ matrix.target }}"
          mkdir -p "$package_root"
          cp "${GITHUB_WORKSPACE}/target/${{ matrix.target }}/release/ayx" "$package_root/ayx"
          cp README.md "$package_root/"
          cp scripts/install.sh "$package_root/"
          tar -czf "${artifact_dir}/ayx-${{ matrix.target }}.tar.gz" -C "$package_root" .
      - uses: actions/upload-artifact@v4
        with:
          name: ayx-${{ matrix.target }}
          path: dist/ayx-${{ matrix.target }}.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-pc-windows-msvc
          rustup component add rustfmt clippy
      - name: Install cargo-nextest
        run: cargo install --locked cargo-nextest
        shell: bash
      - name: Check formatting
        run: cargo fmt --check
        shell: bash
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
        shell: bash
      - name: Run tests
        run: cargo nextest run --workspace
        shell: bash
      - name: Build release
        run: cargo build --release --target x86_64-pc-windows-msvc
        shell: bash
      - name: Verify release binary
        shell: bash
        run: |
          set -euo pipefail
          binary="${GITHUB_WORKSPACE}/target/x86_64-pc-windows-msvc/release/ayx.exe"
          test -f "$binary"
          ls -l "$binary"
      - name: Package Windows release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $artifactDir = Join-Path $env:GITHUB_WORKSPACE 'dist'
          $packageRoot = Join-Path $artifactDir 'ayx-x86_64-pc-windows-msvc'
          New-Item -ItemType Directory -Force -Path $packageRoot | Out-Null
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'target/x86_64-pc-windows-msvc/release/ayx.exe') (Join-Path $packageRoot 'ayx.exe')
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'README.md') $packageRoot
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'scripts/install.ps1') $packageRoot
          $zipPath = Join-Path $artifactDir 'ayx-x86_64-pc-windows-msvc.zip'
          Compress-Archive -Path (Join-Path $packageRoot '*') -DestinationPath $zipPath -Force
      - uses: actions/upload-artifact@v4
        with:
          name: ayx-x86_64-pc-windows-msvc
          path: dist/ayx-x86_64-pc-windows-msvc.zip

  sbom:
    needs:
      - build-linux
      - build-macos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-cyclonedx
        run: cargo install --locked cargo-cyclonedx
      - name: Generate SBOM (CycloneDX)
        run: |
          set -euo pipefail
          mkdir -p sbom
          cargo cyclonedx --format json --override-filename ayx -a
          # cargo-cyclonedx v0.5.x writes one ayx.json per crate directory.
          find . -maxdepth 2 -path './target' -prune -o -name 'ayx.json' -type f -exec cp {} sbom/ \;
          test -n "$(find sbom -maxdepth 1 -type f -name '*.json' -print -quit)"
          ls -la sbom/
      - uses: actions/upload-artifact@v4
        with:
          name: ayx-sbom
          path: sbom/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-linux
      - build-macos
      - build-windows
    # `sbom` is not in `needs` so a billing block or transient sbom failure
    # doesn't prevent the binaries + checksums + cosign bundles from being
    # published. The download-artifact step below tolerates a missing sbom
    # artifact (the bundling block guards on `-d`).
    runs-on: ubuntu-latest
    # OIDC token for sigstore keyless signing + GH artifact attestations.
    # Both rely on workflow identity (no long-lived secrets / keys).
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Flatten release artifacts and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          # Copy archive artifacts to a flat directory.
          for f in \
            dist/ayx-x86_64-unknown-linux-gnu/ayx-x86_64-unknown-linux-gnu.tar.gz \
            dist/ayx-x86_64-apple-darwin/ayx-x86_64-apple-darwin.tar.gz \
            dist/ayx-aarch64-apple-darwin/ayx-aarch64-apple-darwin.tar.gz \
            dist/ayx-x86_64-pc-windows-msvc/ayx-x86_64-pc-windows-msvc.zip; do
            cp "$f" release/
          done
          # Bundle the SBOM(s).
          if [ -d dist/ayx-sbom ]; then
            tar -czf release/ayx-sbom.tar.gz -C dist/ayx-sbom .
          fi
          # Generate SHA256SUMS over every release file.
          cd release
          sha256sum -- * > SHA256SUMS
          echo "---- SHA256SUMS ----"
          cat SHA256SUMS
      # Sigstore keyless signing. Anchors every artifact to the Rekor
      # transparency log using the workflow's OIDC identity — no keys to
      # rotate, no certs to manage. Verifiers run:
      #   cosign verify-blob \
      #     --certificate-identity-regexp '^https://github.com/.+/ayx-rs/' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      #     --bundle release/<file>.sigstore release/<file>
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign every release artifact (sigstore keyless)
        shell: bash
        run: |
          set -euo pipefail
          cd release
          for f in ayx-*.zip ayx-*.tar.gz SHA256SUMS; do
            [ -f "$f" ] || continue
            echo "signing $f"
            cosign sign-blob --yes \
              --bundle "$f.sigstore" \
              "$f"
          done
          ls -la -- *.sigstore
      # GitHub-native build provenance (SLSA L3). Independent of cosign.
      # Verifiable with: gh attestation verify <file> --repo <owner>/ayx-rs
      # Non-fatal: this feature requires a public repo (or paid plan) and is
      # otherwise a clean failure; the rest of the release pipeline produces
      # the same verifiable provenance via the sigstore .sigstore bundles.
      - name: Attest build provenance for every release artifact
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release/ayx-x86_64-unknown-linux-gnu.tar.gz
            release/ayx-x86_64-apple-darwin.tar.gz
            release/ayx-aarch64-apple-darwin.tar.gz
            release/ayx-x86_64-pc-windows-msvc.zip
            release/ayx-sbom.tar.gz
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/ayx-x86_64-unknown-linux-gnu.tar.gz
            release/ayx-x86_64-unknown-linux-gnu.tar.gz.sigstore
            release/ayx-x86_64-apple-darwin.tar.gz
            release/ayx-x86_64-apple-darwin.tar.gz.sigstore
            release/ayx-aarch64-apple-darwin.tar.gz
            release/ayx-aarch64-apple-darwin.tar.gz.sigstore
            release/ayx-x86_64-pc-windows-msvc.zip
            release/ayx-x86_64-pc-windows-msvc.zip.sigstore
            release/ayx-sbom.tar.gz
            release/ayx-sbom.tar.gz.sigstore
            release/SHA256SUMS
            release/SHA256SUMS.sigstore
