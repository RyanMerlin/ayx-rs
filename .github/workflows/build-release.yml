name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-pc-windows-msvc
          rustup component add rustfmt clippy
      - name: Check formatting
        run: cargo fmt --check
        shell: pwsh
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
        shell: pwsh
      - name: Run tests
        run: cargo test --workspace
        shell: pwsh
      - name: Build release
        run: cargo build --release --target x86_64-pc-windows-msvc
        shell: pwsh
      - name: Package Windows release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $artifactDir = Join-Path "${{ github.workspace }}" "dist"
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          $packageRoot = Join-Path $artifactDir "ayx-x86_64-pc-windows-msvc"
          New-Item -ItemType Directory -Force -Path $packageRoot | Out-Null
          Copy-Item (Join-Path "${{ github.workspace }}" "target/x86_64-pc-windows-msvc/release/ayx.exe") -Destination (Join-Path $packageRoot "ayx.exe")
          Copy-Item "README.md" -Destination $packageRoot
          Copy-Item "scripts/install.ps1" -Destination $packageRoot
          Compress-Archive -Path (Join-Path $packageRoot '*') -DestinationPath (Join-Path $artifactDir "ayx-x86_64-pc-windows-msvc.zip") -Force
      - uses: actions/upload-artifact@v4
        with:
          name: ayx-x86_64-pc-windows-msvc
          path: dist/ayx-x86_64-pc-windows-msvc.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-unknown-linux-gnu
          rustup component add rustfmt clippy
      - name: Check formatting
        run: cargo fmt --check
        shell: bash
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
        shell: bash
      - name: Run tests
        run: cargo test --workspace
        shell: bash
      - name: Build release
        run: cargo build --release --target x86_64-unknown-linux-gnu
        shell: bash
      - name: Package Linux release
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="${GITHUB_WORKSPACE}/dist"
          package_root="${artifact_dir}/ayx-x86_64-unknown-linux-gnu"
          mkdir -p "$package_root"
          cp "${GITHUB_WORKSPACE}/target/x86_64-unknown-linux-gnu/release/ayx" "$package_root/ayx"
          cp README.md "$package_root/"
          cp scripts/install.sh "$package_root/"
          tar -czf "${artifact_dir}/ayx-x86_64-unknown-linux-gnu.tar.gz" -C "$package_root" .
      - uses: actions/upload-artifact@v4
        with:
          name: ayx-x86_64-unknown-linux-gnu
          path: dist/ayx-x86_64-unknown-linux-gnu.tar.gz

  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        target:
          - x86_64-apple-darwin
          - aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}
          rustup component add rustfmt clippy
      - name: Check formatting
        run: cargo fmt --check
        shell: bash
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
        shell: bash
      - name: Run tests
        run: cargo test --workspace
        shell: bash
      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}
        shell: bash
      - name: Package macOS release
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="${GITHUB_WORKSPACE}/dist"
          package_root="${artifact_dir}/ayx-${{ matrix.target }}"
          mkdir -p "$package_root"
          cp "${GITHUB_WORKSPACE}/target/${{ matrix.target }}/release/ayx" "$package_root/ayx"
          cp README.md "$package_root/"
          cp scripts/install.sh "$package_root/"
          tar -czf "${artifact_dir}/ayx-${{ matrix.target }}.tar.gz" -C "$package_root" .
      - uses: actions/upload-artifact@v4
        with:
          name: ayx-${{ matrix.target }}
          path: dist/ayx-${{ matrix.target }}.tar.gz

  sbom:
    needs:
      - build-windows
      - build-linux
      - build-macos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-cyclonedx
        run: cargo install --locked cargo-cyclonedx
      - name: Generate SBOM (CycloneDX)
        run: |
          mkdir -p sbom
          cargo cyclonedx --format json --override-filename ayx -a
          # cyclonedx writes per-crate; aggregate into one for upload.
          find . -maxdepth 3 -name 'ayx*.cdx.json' -exec cp {} sbom/ \;
          ls -la sbom/
      - uses: actions/upload-artifact@v4
        with:
          name: ayx-sbom
          path: sbom/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-windows
      - build-linux
      - build-macos
      - sbom
    runs-on: ubuntu-latest
    # OIDC token for sigstore keyless signing + GH artifact attestations.
    # Both rely on workflow identity (no long-lived secrets / keys).
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Flatten release artifacts and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          # Copy archive artifacts to a flat directory.
          for f in \
            dist/ayx-x86_64-pc-windows-msvc/ayx-x86_64-pc-windows-msvc.zip \
            dist/ayx-x86_64-unknown-linux-gnu/ayx-x86_64-unknown-linux-gnu.tar.gz \
            dist/ayx-x86_64-apple-darwin/ayx-x86_64-apple-darwin.tar.gz \
            dist/ayx-aarch64-apple-darwin/ayx-aarch64-apple-darwin.tar.gz; do
            cp "$f" release/
          done
          # Bundle the SBOM(s).
          if [ -d dist/ayx-sbom ]; then
            tar -czf release/ayx-sbom.tar.gz -C dist/ayx-sbom .
          fi
          # Generate SHA256SUMS over every release file.
          cd release
          sha256sum * > SHA256SUMS
          echo "---- SHA256SUMS ----"
          cat SHA256SUMS
      # Sigstore keyless signing. Anchors every artifact to the Rekor
      # transparency log using the workflow's OIDC identity — no keys to
      # rotate, no certs to manage. Verifiers run:
      #   cosign verify-blob \
      #     --certificate-identity-regexp '^https://github.com/RyanMerlin/ayx-rs/' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      #     --bundle release/<file>.sigstore release/<file>
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign every release artifact (sigstore keyless)
        shell: bash
        run: |
          set -euo pipefail
          cd release
          for f in ayx-*.zip ayx-*.tar.gz SHA256SUMS; do
            [ -f "$f" ] || continue
            echo "signing $f"
            cosign sign-blob --yes \
              --bundle "$f.sigstore" \
              "$f"
          done
          ls -la *.sigstore
      # GitHub-native build provenance (SLSA L3). Independent of cosign.
      # Verifiable with: gh attestation verify <file> --repo RyanMerlin/ayx-rs
      - name: Attest build provenance for every release artifact
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release/ayx-x86_64-pc-windows-msvc.zip
            release/ayx-x86_64-unknown-linux-gnu.tar.gz
            release/ayx-x86_64-apple-darwin.tar.gz
            release/ayx-aarch64-apple-darwin.tar.gz
            release/ayx-sbom.tar.gz
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          repository: RyanMerlin/ayx-rs
          token: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
          files: |
            release/ayx-x86_64-pc-windows-msvc.zip
            release/ayx-x86_64-pc-windows-msvc.zip.sigstore
            release/ayx-x86_64-unknown-linux-gnu.tar.gz
            release/ayx-x86_64-unknown-linux-gnu.tar.gz.sigstore
            release/ayx-x86_64-apple-darwin.tar.gz
            release/ayx-x86_64-apple-darwin.tar.gz.sigstore
            release/ayx-aarch64-apple-darwin.tar.gz
            release/ayx-aarch64-apple-darwin.tar.gz.sigstore
            release/ayx-sbom.tar.gz
            release/ayx-sbom.tar.gz.sigstore
            release/SHA256SUMS
            release/SHA256SUMS.sigstore
