name: Live Smoke (Alteryx One)

# Exercises the ayx-rs live-smoke suite against a real Alteryx One tenant.
# Manual-only (workflow_dispatch) by design: this is a public repo, and putting
# a long-lived real-tenant access token into its Actions secrets is a worse
# posture than not running this on a schedule at all. No AYX_ONE_* secrets are
# configured here -- run this manually against a private fork or a secured
# environment when you need a live check, or use the local runbook at
# docs/one-live-validation.md instead. If secrets are ever added here anyway,
# with no access-token secret the job still skips cleanly (green) rather than
# failing, and the token-liveness gate (live_smoke_requires_a_live_token) goes
# RED when a configured PAT has expired -- that red run is the signal to
# rotate it via `ayx one login`.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  live-smoke:
    name: Live smoke (${{ vars.AYX_ONE_REGION || 'us1' }})
    runs-on: ubuntu-latest
    steps:
      - name: Check credentials
        id: creds
        env:
          AYX_ONE_API_ACCESS_TOKEN: ${{ secrets.AYX_ONE_API_ACCESS_TOKEN }}
        run: |
          if [ -z "${AYX_ONE_API_ACCESS_TOKEN}" ]; then
            echo "No AYX_ONE_API_ACCESS_TOKEN secret configured; skipping live smoke." >> "$GITHUB_STEP_SUMMARY"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.creds.outputs.configured == 'true'
        uses: actions/checkout@v7

      - name: Cache
        if: steps.creds.outputs.configured == 'true'
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        if: steps.creds.outputs.configured == 'true'
        uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: cargo-nextest

      - name: Materialize .env from secrets
        if: steps.creds.outputs.configured == 'true'
        env:
          AYX_ONE_API_ACCESS_TOKEN: ${{ secrets.AYX_ONE_API_ACCESS_TOKEN }}
          AYX_ONE_API_REFRESH_TOKEN: ${{ secrets.AYX_ONE_API_REFRESH_TOKEN }}
          AYX_ACCOUNT_EMAIL: ${{ secrets.AYX_ACCOUNT_EMAIL }}
          AYX_ONE_OAUTH_CLIENT_ID: ${{ secrets.AYX_ONE_OAUTH_CLIENT_ID }}
          AYX_ONE_TOKEN_ENDPOINT_URL: ${{ secrets.AYX_ONE_TOKEN_ENDPOINT_URL }}
          AYX_ONE_BASE_URL: ${{ secrets.AYX_ONE_BASE_URL }}
        run: |
          umask 077
          {
            printf 'AYX_ONE_API_ACCESS_TOKEN=%s\n' "${AYX_ONE_API_ACCESS_TOKEN}"
            printf 'AYX_ONE_API_REFRESH_TOKEN=%s\n' "${AYX_ONE_API_REFRESH_TOKEN}"
            printf 'AYX_ACCOUNT_EMAIL=%s\n' "${AYX_ACCOUNT_EMAIL}"
            printf 'AYX_ONE_OAUTH_CLIENT_ID=%s\n' "${AYX_ONE_OAUTH_CLIENT_ID}"
            printf 'AYX_ONE_TOKEN_ENDPOINT_URL=%s\n' "${AYX_ONE_TOKEN_ENDPOINT_URL}"
          } > .env
          if [ -n "${AYX_ONE_BASE_URL}" ]; then
            printf 'AYX_ONE_BASE_URL=%s\n' "${AYX_ONE_BASE_URL}" >> .env
          fi

      - name: Run live smoke
        if: steps.creds.outputs.configured == 'true'
        env:
          AYX_ONE_LIVE_SMOKE: "1"
        run: cargo nextest run -p ayx-rs -E 'binary(one_live_smoke)'

      - name: Scrub .env
        if: always()
        run: rm -f .env
