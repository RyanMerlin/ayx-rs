stages:
  - build
  - release

workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
    - when: never

.build_template:
  stage: build
  variables:
    CARGO_TERM_COLOR: "always"
  before_script:
    - rustc --version
    - cargo --version

windows:
  extends: .build_template
  tags:
    - windows
  script:
    - cargo build --release --locked --target x86_64-pc-windows-msvc
    - New-Item -ItemType Directory -Force -Path dist | Out-Null
    - Copy-Item target/x86_64-pc-windows-msvc/release/ayx.exe dist/ayx.exe
    - Compress-Archive -Path dist/ayx.exe -DestinationPath dist/ayx-x86_64-pc-windows-msvc.zip -Force
  artifacts:
    name: "ayx-x86_64-pc-windows-msvc-$CI_COMMIT_TAG"
    paths:
      - dist/ayx-x86_64-pc-windows-msvc.zip
    expire_in: never

linux:
  extends: .build_template
  tags:
    - linux
  script:
    - cargo build --release --locked --target x86_64-unknown-linux-gnu
    - mkdir -p dist
    - cp target/x86_64-unknown-linux-gnu/release/ayx dist/ayx
    - tar -czf dist/ayx-x86_64-unknown-linux-gnu.tar.gz -C dist ayx
  artifacts:
    name: "ayx-x86_64-unknown-linux-gnu-$CI_COMMIT_TAG"
    paths:
      - dist/ayx-x86_64-unknown-linux-gnu.tar.gz
    expire_in: never

macos_x86_64:
  extends: .build_template
  tags:
    - macos
  script:
    - cargo build --release --locked --target x86_64-apple-darwin
    - mkdir -p dist
    - cp target/x86_64-apple-darwin/release/ayx dist/ayx
    - tar -czf dist/ayx-x86_64-apple-darwin.tar.gz -C dist ayx
  artifacts:
    name: "ayx-x86_64-apple-darwin-$CI_COMMIT_TAG"
    paths:
      - dist/ayx-x86_64-apple-darwin.tar.gz
    expire_in: never

macos_aarch64:
  extends: .build_template
  tags:
    - macos
  script:
    - cargo build --release --locked --target aarch64-apple-darwin
    - mkdir -p dist
    - cp target/aarch64-apple-darwin/release/ayx dist/ayx
    - tar -czf dist/ayx-aarch64-apple-darwin.tar.gz -C dist ayx
  artifacts:
    name: "ayx-aarch64-apple-darwin-$CI_COMMIT_TAG"
    paths:
      - dist/ayx-aarch64-apple-darwin.tar.gz
    expire_in: never

gitlab_release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: windows
      artifacts: true
    - job: linux
      artifacts: true
    - job: macos_x86_64
      artifacts: true
    - job: macos_aarch64
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
  script:
    - echo "Publishing GitLab release for $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "AYX $CI_COMMIT_TAG"
    description: "Prebuilt release artifacts for $CI_COMMIT_TAG"
    assets:
      links:
        - name: "ayx-x86_64-pc-windows-msvc.zip"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/dist/ayx-x86_64-pc-windows-msvc.zip?job=windows"
        - name: "ayx-x86_64-unknown-linux-gnu.tar.gz"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/dist/ayx-x86_64-unknown-linux-gnu.tar.gz?job=linux"
        - name: "ayx-x86_64-apple-darwin.tar.gz"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/dist/ayx-x86_64-apple-darwin.tar.gz?job=macos_x86_64"
        - name: "ayx-aarch64-apple-darwin.tar.gz"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/dist/ayx-aarch64-apple-darwin.tar.gz?job=macos_aarch64"
