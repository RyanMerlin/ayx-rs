[package]
name = "ayx-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
ui = []

[dependencies]
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
clap_complete.workspace = true
reqwest.workspace = true
roxmltree.workspace = true
serde.workspace = true
serde_yaml.workspace = true
serde_json.workspace = true
crossterm.workspace = true
inquire.workspace = true
url.workspace = true
ayx_server_api = { package = "ayx-server-api", path = "../ayx-server-api" }
ayx-core = { path = "../ayx-core" }
ayx-workflow = { path = "../ayx-workflow" }
ayx-one = { path = "../ayx-one" }
ayx_one_api = { package = "ayx-one-api", path = "../ayx-one-api" }
ayx-server = { path = "../ayx-server" }
ayx-registry = { path = "../ayx-registry" }
self_update.workspace = true
tokio.workspace = true
base64.workspace = true
keyring-core.workspace = true
rpassword = "7.5.4"
jaq-core.workspace = true
jaq-json.workspace = true
jaq-std.workspace = true
open.workspace = true

[dev-dependencies]
tempfile.workspace = true
regex.workspace = true
reqwest = { workspace = true }
httpmock.workspace = true
# Enable the test-inline-forcing feature so AYX_FORCE_INLINE_SECRETS is active
# during `cargo nextest run` / `cargo test` for this crate.  The production
# [dependencies] edge above does NOT enable this feature, so the seam is
# compiled out of release binaries (Cargo resolver = "2" keeps dev-dep feature
# activations isolated from the normal build graph).
ayx-core = { path = "../ayx-core", features = ["test-inline-forcing"] }

[[bin]]
name = "ayx"
path = "src/main.rs"
