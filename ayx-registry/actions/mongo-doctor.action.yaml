id: mongo.doctor
title: Diagnose Alteryx Mongo health
summary: |
  Run the read-only Mongo doctor query suite to surface queue, results,
  orphan, and app-binding issues without touching state. Safe to run any
  time, including during incidents.
safety: read_only
trigger:
  task_keywords:
    - mongo doctor
    - diagnose mongo
    - queue stuck
    - orphan
    - mongo health
  tags:
    - mongo
    - diagnose
    - support
steps:
  - kind: command
    cmd: "ayx mongo status --profile <profile>"
    why: "Confirm connectivity and embedded vs. managed posture."
  - kind: command
    cmd: "ayx mongo doctor --profile <profile> --output json"
    why: "Run the registry of read-only diagnostic queries and emit a structured envelope."
  - kind: note
    text: "If `results` shows a non-empty failures array, treat each entry as an incident lead rather than truth — re-run the underlying query in mongosh for the full payload."
validations:
  - describe: "Doctor envelope shows ok=true for every named query, or carries an explicit failures list."
input_schema:
  type: object
  description: "Parameters for running the read-only Mongo doctor diagnostic suite against one profile."
  additionalProperties: false
  required: [profile]
  properties:
    profile:
      type: string
      description: "Named ayx CLI profile (as configured via ayx profiles) identifying which Alteryx Server environment to target."
      minLength: 1
output_schema:
  type: object
  description: "The ActionRun record this action's run or plan produces."
  required: [action_id, title, safety, apply, mode, params, steps, validations]
  properties:
    action_id:
      type: string
      description: "Stable identifier for this action; always equals mongo.doctor."
      const: mongo.doctor
    title:
      type: string
      description: "Human-readable title for this action."
    safety:
      type: string
      description: "Safety classification for this action's run: read_only, mutating, or destructive."
      enum: [read_only, mutating, destructive]
    apply:
      type: boolean
      description: "Whether this run was invoked with --apply (true) or produced a dry-run plan only (false)."
    mode:
      type: string
      description: "Run mode: \"plan\" when --apply was not set, \"execute\" when it was."
      enum: [plan, execute]
    params:
      type: object
      description: "The parameter map actually used to run or plan this action (string values only)."
    steps:
      type: array
      description: "Ordered per-step outcome (command, composed action, or note) for this run."
      items:
        type: object
        description: "One planned or executed step outcome for this run."
    validations:
      type: array
      description: "Human-readable validation descriptions declared for this action; not automatically executed."
      items:
        type: string
        description: "One validation's description text."
