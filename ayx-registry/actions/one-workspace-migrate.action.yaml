id: one.workspace-migrate
title: Migrate Alteryx One assets between workspaces
summary: |
  Move flows, plans, connections, and write-settings from a source
  workspace to a target workspace. Uses the central environments file to
  resolve source/target, runs a dry-run plan first, requires --apply to
  execute, and asserts workspace identity preflight before each mutating
  call.
safety: destructive
trigger:
  task_keywords:
    - migrate workspace
    - workspace migration
    - move flows between workspaces
    - promote to prod
  tags:
    - one
    - workspace
    - migration
    - governance
steps:
  - kind: command
    cmd: "ayx --environment <source> one workspace current --output json"
    why: "Confirm the source workspace id matches expectations."
  - kind: command
    cmd: "ayx --environment <target> one workspace current --output json"
    why: "Confirm the target workspace id matches expectations. Both should be pinned in alteryx_one.expected_workspace_id."
  - kind: command
    cmd: "ayx --environment <source> one flows list --all --output json"
    why: "Enumerate every flow that will be considered for migration."
  - kind: command
    cmd: "ayx --environment <source> one connections list --all --output json"
    why: "Enumerate every connection in the source — these usually need to be re-created (not exported) in the target."
  - kind: note
    text: |
      Whole-workspace migration today is a per-resource loop: invoke `one.flow.promote`
      once per flow id from the list above. A dedicated `ayx tools workspace migrate`
      orchestrator is on the roadmap (see docs/roadmap/workspace-and-registry-tooling.md) — once it ships, the loop
      collapses to a single `tools workspace migrate --source <source> --target <target>`
      invocation with the same safety/audit guarantees.
  - kind: action
    id: one.flow.promote
    why: "Promote each flow individually so every step is gated and audited. Use this action in a shell loop seeded from the flow list above."
  - kind: note
    text: "Migration emits per-object audit artifacts under $AYX_CONFIG_HOME/audits/. Keep them — they are the rollback ledger."
validations:
  - describe: "Target workspace `one flows list --all` count matches the source plus pre-existing baseline."
    check_cmd: "ayx --environment <target> one flows count --output json"
  - describe: "No mutating envelope reports error_code != null."
rollback: |
  Replay the migration plan in reverse against the target workspace, or
  restore from the per-object audit artifacts. Always coordinate with
  whoever owns the target workspace before rolling back live traffic.
input_schema:
  type: object
  description: "Parameters for migrating Alteryx One assets from a source workspace/environment to a target workspace/environment, one flow at a time via the composed one.flow.promote action."
  additionalProperties: false
  required: [source, target, flow_id]
  properties:
    source:
      type: string
      description: "Environment name, as configured in ayx's environments file, to promote or migrate assets FROM."
      minLength: 1
    target:
      type: string
      description: "Environment name, as configured in ayx's environments file, to promote or migrate assets TO."
      minLength: 1
    flow_id:
      type: string
      description: "Alteryx One flow id being promoted between environments."
      minLength: 1
output_schema:
  type: object
  description: "The ActionRun record this action's run or plan produces."
  required: [action_id, title, safety, apply, mode, params, steps, validations, rollback]
  properties:
    action_id:
      type: string
      description: "Stable identifier for this action; always equals one.workspace-migrate."
      const: one.workspace-migrate
    title:
      type: string
      description: "Human-readable title for this action."
    safety:
      type: string
      description: "Safety classification for this action's run: read_only, mutating, or destructive."
      enum: [read_only, mutating, destructive]
    apply:
      type: boolean
      description: "Whether this run was invoked with --apply (true) or produced a dry-run plan only (false)."
    mode:
      type: string
      description: "Run mode: \"plan\" when --apply was not set, \"execute\" when it was."
      enum: [plan, execute]
    params:
      type: object
      description: "The parameter map actually used to run or plan this action (string values only)."
    steps:
      type: array
      description: "Ordered per-step outcome (command, composed action, or note) for this run."
      items:
        type: object
        description: "One planned or executed step outcome for this run."
    validations:
      type: array
      description: "Human-readable validation descriptions declared for this action; not automatically executed."
      items:
        type: string
        description: "One validation's description text."
    rollback:
      type: string
      description: "Rollback guidance for a bad migration: replay the migration plan in reverse against the target workspace, or restore from the per-object audit artifacts."
