id: server.auth.saml-diagnose
title: Diagnose Alteryx Server SAML authentication
summary: |
  Read-only SAML posture check. Validates metadata, certificate chains,
  callback URLs, and (when available) simulates an assertion to spot
  problems before opening a support ticket.
safety: read_only
trigger:
  task_keywords:
    - saml
    - sso broken
    - login fails
    - idp
    - server auth
  tags:
    - server
    - auth
    - saml
    - diagnose
steps:
  - kind: command
    cmd: "ayx server auth status --profile <profile> --output json"
    why: "Snapshot of the configured auth mode + posture."
  - kind: command
    cmd: "ayx server auth diagnose saml --metadata-url <idp-metadata-url> --output json"
    why: "Fetch and validate IdP metadata against Server's expectations."
  - kind: command
    cmd: "ayx server auth diagnose certificate --profile <profile> --output json"
    why: "Validate the cert chain and expiry of the SAML signing cert."
  - kind: command
    cmd: "ayx server auth simulate saml --metadata-file ./idp-metadata.xml --output json"
    why: "When the IdP exposes a static metadata file, simulate an assertion locally to spot binding/encoding mismatches."
validations:
  - describe: "Every diagnose envelope returns ok=true and no error_code."
  - describe: "Certificate envelope shows expiry > 60 days out (rotate proactively)."
input_schema:
  type: object
  description: "Parameters for diagnosing Alteryx Server SAML authentication posture, including the IdP metadata URL to validate."
  additionalProperties: false
  required: [profile, idp-metadata-url]
  properties:
    profile:
      type: string
      description: "Named ayx CLI profile (as configured via ayx profiles) identifying which Alteryx Server environment to target."
      minLength: 1
    idp-metadata-url:
      type: string
      description: "HTTPS URL to the identity provider's SAML metadata document, passed to ayx server auth diagnose saml --metadata-url."
      minLength: 1
output_schema:
  type: object
  description: "The ActionRun record this action's run or plan produces."
  required: [action_id, title, safety, apply, mode, params, steps, validations]
  properties:
    action_id:
      type: string
      description: "Stable identifier for this action; always equals server.auth.saml-diagnose."
      const: server.auth.saml-diagnose
    title:
      type: string
      description: "Human-readable title for this action."
    safety:
      type: string
      description: "Safety classification for this action's run: read_only, mutating, or destructive."
      enum: [read_only, mutating, destructive]
    apply:
      type: boolean
      description: "Whether this run was invoked with --apply (true) or produced a dry-run plan only (false)."
    mode:
      type: string
      description: "Run mode: \"plan\" when --apply was not set, \"execute\" when it was."
      enum: [plan, execute]
    params:
      type: object
      description: "The parameter map actually used to run or plan this action (string values only)."
    steps:
      type: array
      description: "Ordered per-step outcome (command, composed action, or note) for this run."
      items:
        type: object
        description: "One planned or executed step outcome for this run."
    validations:
      type: array
      description: "Human-readable validation descriptions declared for this action; not automatically executed."
      items:
        type: string
        description: "One validation's description text."
