id: mongo.queue.stuck
title: Diagnose a stuck Alteryx Server job queue
summary: |
  Step-by-step read-only investigation when AS_Queue is not draining.
  Inventories queue depth, stuck-job patterns, and cross-references
  against AlteryxService for owner lookups. Does not mutate state.
safety: read_only
trigger:
  task_keywords:
    - queue stuck
    - queue not draining
    - jobs not running
    - AS_Queue
    - workers idle
  tags:
    - mongo
    - queue
    - diagnose
    - support
    - incident
steps:
  - kind: command
    cmd: "ayx mongo query --profile <profile> --database AlteryxService --collection AS_Queue --filter '{}' --output json"
    why: "Total queue depth + per-state counts. Confirms the queue is non-empty."
  - kind: command
    cmd: "ayx mongo query --profile <profile> --database AlteryxService --collection AS_Queue --filter '{\"State\":\"Running\"}' --output json"
    why: "Surface jobs that have been Running too long — likely the actual culprits."
  - kind: command
    cmd: "ayx mongo doctor --profile <profile> --output json"
    why: "Cross-references the queue against worker registration, license posture, and orphan detection in one shot."
  - kind: note
    text: |
      `ayx mongo mutate` is live: a named, bounded template preview/approve/
      apply flow (see `ayx mongo mutate --help` and the MongoDB docs page),
      not free-form remediation. The bundled registry ships no AS_Queue
      remediation template today — the only shipped template
      (`user_email_domain_migration`) targets `AlteryxGallery.users` and
      stays `preview_only` on purpose. Do not bulk-update AS_Queue by hand.
      Remediation requires an owner-reviewed, `executable`-promoted template
      with a blast radius capped to the real incident (`max_affected`), a
      current backup proven via `--backup-audit-artifact` (take one first
      with `mongo.backup-restore`), a reviewed preview diff, and its digest
      passed to `--approve`. Never skip the preview step.
validations:
  - describe: "Doctor results array has zero entries with ok=false."
  - describe: "Running-jobs query length matches what the dashboards show; mismatches indicate cache lag, not a real bug."
input_schema:
  type: object
  description: "Parameters for investigating a stuck Alteryx Server job queue (AS_Queue) in one profile."
  additionalProperties: false
  required: [profile]
  properties:
    profile:
      type: string
      description: "Named ayx CLI profile (as configured via ayx profiles) identifying which Alteryx Server environment to target."
      minLength: 1
output_schema:
  type: object
  description: "The ActionRun record this action's run or plan produces."
  required: [action_id, title, safety, apply, mode, params, steps, validations]
  properties:
    action_id:
      type: string
      description: "Stable identifier for this action; always equals mongo.queue.stuck."
      const: mongo.queue.stuck
    title:
      type: string
      description: "Human-readable title for this action."
    safety:
      type: string
      description: "Safety classification for this action's run: read_only, mutating, or destructive."
      enum: [read_only, mutating, destructive]
    apply:
      type: boolean
      description: "Whether this run was invoked with --apply (true) or produced a dry-run plan only (false)."
    mode:
      type: string
      description: "Run mode: \"plan\" when --apply was not set, \"execute\" when it was."
      enum: [plan, execute]
    params:
      type: object
      description: "The parameter map actually used to run or plan this action (string values only)."
    steps:
      type: array
      description: "Ordered per-step outcome (command, composed action, or note) for this run."
      items:
        type: object
        description: "One planned or executed step outcome for this run."
    validations:
      type: array
      description: "Human-readable validation descriptions declared for this action; not automatically executed."
      items:
        type: string
        description: "One validation's description text."
