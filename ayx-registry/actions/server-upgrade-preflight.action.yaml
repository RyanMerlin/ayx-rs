id: server.upgrade.preflight
title: Pre-upgrade preflight for Alteryx Server
summary: |
  Read-only safety sweep before kicking off a Server upgrade: validate
  config, capture a Mongo snapshot, dump current auth posture, and verify
  there are no in-flight jobs. Outputs a single bundle of evidence for
  the change record.
safety: mutating
trigger:
  task_keywords:
    - upgrade server
    - server upgrade
    - preflight
    - pre-upgrade
  tags:
    - server
    - upgrade
    - change-management
    - safety
steps:
  - kind: command
    cmd: "ayx doctor config --profile <profile> --output json"
    why: "Validate config + secret refs resolve cleanly. Upgrade fails fast if anything is malformed."
  - kind: command
    cmd: "ayx server auth status --profile <profile> --output json"
    why: "Snapshot auth posture so post-upgrade comparison is possible."
  - kind: action
    id: mongo.backup-restore
    why: "Take the snapshot. Mandatory before any upgrade."
  - kind: command
    cmd: "ayx server api status --profile <profile> --output json"
    why: "Capture API reachability + auth posture so post-upgrade comparison is possible."
  - kind: command
    cmd: "ayx server upgrade plan --profile <profile> --output json"
    why: "Compute the upgrade plan envelope (rules, version graph, expected migrations). Read-only."
  - kind: note
    text: |
      Active-job draining is checked via the Mongo `mongo.queue.stuck` action
      below — the AS_Queue queue depth and per-state counts are what actually
      matter, not a single status RPC.
  - kind: action
    id: mongo.queue.stuck
    why: "Confirm the AS_Queue is empty or only holds Queued (not Running) jobs before kicking off the upgrade."
validations:
  - describe: "Mongo backup artifact exists and is non-empty."
  - describe: "Server queue is empty (count = 0)."
  - describe: "Doctor config envelope has no findings."
rollback: |
  Preflight itself is mutating only via the Mongo snapshot, which is
  additive. If the upgrade itself goes wrong, restore from the snapshot
  captured here via `mongo.backup-restore` (restore branch).
input_schema:
  type: object
  description: "Parameters for running the pre-upgrade preflight sweep, including the Mongo snapshot timestamp captured by the composed mongo.backup-restore action."
  additionalProperties: false
  required: [profile, ts]
  properties:
    profile:
      type: string
      description: "Named ayx CLI profile (as configured via ayx profiles) identifying which Alteryx Server environment to target."
      minLength: 1
    ts:
      type: string
      description: "Timestamp label used to name the backup/restore artifact directory (for example backups/<ts>)."
      minLength: 1
output_schema:
  type: object
  description: "The ActionRun record this action's run or plan produces."
  required: [action_id, title, safety, apply, mode, params, steps, validations, rollback]
  properties:
    action_id:
      type: string
      description: "Stable identifier for this action; always equals server.upgrade.preflight."
      const: server.upgrade.preflight
    title:
      type: string
      description: "Human-readable title for this action."
    safety:
      type: string
      description: "Safety classification for this action's run: read_only, mutating, or destructive."
      enum: [read_only, mutating, destructive]
    apply:
      type: boolean
      description: "Whether this run was invoked with --apply (true) or produced a dry-run plan only (false)."
    mode:
      type: string
      description: "Run mode: \"plan\" when --apply was not set, \"execute\" when it was."
      enum: [plan, execute]
    params:
      type: object
      description: "The parameter map actually used to run or plan this action (string values only)."
    steps:
      type: array
      description: "Ordered per-step outcome (command, composed action, or note) for this run."
      items:
        type: object
        description: "One planned or executed step outcome for this run."
    validations:
      type: array
      description: "Human-readable validation descriptions declared for this action; not automatically executed."
      items:
        type: string
        description: "One validation's description text."
    rollback:
      type: string
      description: "Rollback guidance if the upgrade itself goes wrong: restore from the Mongo snapshot captured by the composed mongo.backup-restore step."
