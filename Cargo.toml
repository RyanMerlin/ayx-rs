[workspace]
resolver = "2"
members = [
  "ayx-rs",
  "ayx-core",
  "ayx-server",
  "ayx-server-api",
  "ayx-one-api",
  "ayx-workflow",
  "ayx-one",
  "ayx-docs-schema",
]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.3.6"
authors = ["AYX Team", "Ryan Merlin"]

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "multipart"] }
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tempfile = "3"
thiserror = "2"
url = "2"
walkdir = "2"
zip = "0.6"
sha2 = "0.10"
