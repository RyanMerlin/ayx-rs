[workspace]
resolver = "2"
members = [
  "ayx-rs",
  "ayx-core",
  "ayx-server",
  "ayx-server-api",
  "ayx-one-api",
  "ayx-workflow",
  "ayx-one",
  "ayx-registry",
  "xtask",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
version = "0.12.2"
authors = ["Ryan Merlin"]

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
crossterm = "0.29"
csv = "1"
fs_extra = "1.3"
httpmock = "0.8"
keyring-core = "1"
lzf = "1"
maud = "0.27"
mime_guess = "2"
nucleo-matcher = "0.3"
ratatui = "0.30"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "cookies", "form", "json", "rustls", "multipart"] }
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
serial_test = "3"
snap = "1"
self_update = { version = "0.44.0", features = [
    "archive-tar",
    "compression-flate2",
    "archive-zip",
    "compression-zip-deflate",
] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["trace", "compression-gzip"] }
tui-input = { version = "0.15", default-features = false }
rust-embed = "8"
url = "2"
walkdir = "2"
zip = "8"
sha2 = "0.11"
